image: docker:dind

variables:
  GIT_SSL_NO_VERIFY: "1"

stages:
  - format
  - build_docker

prettier_check:
  image: docker.mirror.erg.kz/node:18
  stage: format
  tags:
    - itdev-platform-data
  script:
    - cd superset-frontend
    - npm ci
    - npm run prettier-check
  only:
    - main
    - merge_requests

build_docker_superset:
  image: docker.mirror.erg.kz/docker:20-dind
  stage: build_docker
  tags:
    - itdev-platform-data
  script:
    - docker login -u $NEXUS_LOGIN -p $NEXUS_PASS docker.erg.kz
    - docker build --no-cache --ulimit nofile=65536:65536 . -t docker.erg.kz/erg/cv/superset-data-platform:$CI_COMMIT_SHORT_SHA
    - docker push docker.erg.kz/erg/cv/superset-data-platform:$CI_COMMIT_SHORT_SHA
    - echo "Current image docker.erg.kz/erg/cv/superset-data-platform:$CI_COMMIT_SHORT_SHA"
  only:
    - main
